hydra:
  run:
    dir: ${paths.base_dir}/${run_id}
  sweep:
    dir: ${paths.base_dir}/${run_id}
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - paths=hyak
    - note=hyak_ckpt
    - training=ppo_basic_imitation_low_kl
    - dataset=imitation_walk_anipose_data_v1
    - load_jobid=
    - run_id=33912115
    - training/network=intention_ws
    - train_args.num_envs=4096
  job:
    name: train_basic_imitation
    chdir: null
    override_dirname: dataset=imitation_walk_anipose_data_v1,load_jobid=,train_args.num_envs=4096,training/network=intention_ws
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - paths
        - anatomy
        - note
        - run_id
        - seed
        - version
        - training
        - muscles
        - sensors
        - physics
        - integration
        - vnc_sim
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /mmfs1/gscratch/portia/eabe/Research/MyRepos/DigitalSphinx2026
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mmfs1/gscratch/portia/eabe/Research/MyRepos/DigitalSphinx2026/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /gscratch/portia/eabe/TheSphinx/walk/33912115
    choices:
      dataset: imitation_walk_anipose_data_v1
      paths: hyak
      connectome: C_elegans_VRNN
      training/anatomy: v1
      training: ppo_basic_imitation_low_kl
      training/network: intention_ws
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
