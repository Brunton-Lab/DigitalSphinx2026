# Template paths configuration for new users / new machines.
#
# Copy this file to configs/paths/<your-machine>.yaml (e.g. mylaptop.yaml,
# mycluster.yaml) and edit the CHANGEME entry. Then run training/viz with:
#
#   python scripts/train_basic_imitation.py paths=<your-machine>
#
# The defaults below assume the in-repo data layout documented in the README
# (Dryad bundle unpacked into `data/pretrained/<version>/` and
# `data/datasets/`). For training runs on a cluster you will typically want
# to override `base_dir` (and possibly `data_dir`) to point at scratch
# storage instead — see configs/paths/hyak.yaml or tillicum.yaml for examples.
#
# Tips:
#   - `user` auto-resolves from the $USER environment variable. Override on
#     the command line with `paths.user=someone_else` if needed.
#   - All path subfields below use ${paths.project_dir} interpolation, so
#     usually you only need to edit `project_dir`. The rest derive
#     automatically.
#   - Use absolute paths. Relative paths break when Hydra changes the working
#     directory at runtime.

user: ${oc.env:USER}

# Where you cloned this repository. Must be an absolute path.
project_dir: "/CHANGEME/path/to/DigitalSphinx2026"

# Where training outputs (checkpoints, logs, figures, videos) go. Defaults to
# the in-repo `data/pretrained/<version>/` layout so the shipped Dryad
# rollout resolves out of the box. Point this at scratch storage when
# training new runs.
base_dir: "${paths.project_dir}/data/pretrained/${version}"
save_dir: ${multirun_save_dir:${paths.base_dir},${run_id}}
log_dir:  "${paths.save_dir}/logs/"
ckpt_dir: "${paths.save_dir}/ckpt/"
fig_dir:  "${paths.save_dir}/figures/"

# Where reference clip datasets live (HDF5 files referenced by the dataset
# config). Defaults to in-repo `data/datasets/` — drop the Dryad HDF5 there.
data_dir: "${paths.project_dir}/data"

# Submodule paths (relative to project_dir; usually no edits needed).
body_models_dir: "${paths.project_dir}/sphinx_training/fruitfly_body_models"

# Connectome data paths (relative to project_dir; usually no edits needed).
connectome_data_dir: "${paths.project_dir}/data/connectome/C_elegans"
